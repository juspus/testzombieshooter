<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cabin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Cabin</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      html, body { width: 100%; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; font-family: 'Courier New', monospace; touch-action: none; }
      #root { width: var(--app-width, 100vw); height: var(--app-height, 100dvh); overflow: hidden; }
      /* A game, not a web page: arrow cursor everywhere (inline styles still say pointer), I-beam in
         text fields, no tap flash, no image dragging. */
      *, *::before, *::after { cursor: default !important; -webkit-tap-highlight-color: transparent; }
      input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]), textarea, [contenteditable="true"] { cursor: text !important; }
      img { -webkit-user-drag: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
